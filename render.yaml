# Render Blueprint - Rural Dispatch
# Monorepo deployment with staging and production environments
version: "1"

projects:
  - name: rural_dispatch

    # ==========================================
    # STAGING ENVIRONMENT
    # ==========================================
    environments:
      - name: Staging
        services:
          # React Frontend - Staging
          - type: web
            name: stage-ride-request-client
            runtime: static
            repo: https://github.com/swarmnyc/ruraldispatch-ride-request
            branch: feat/move_relational_db
            rootDir: client
            plan: free
            region: ohio
            buildCommand: npm install && npm run build
            staticPublishPath: ./dist
            envVars:
              - key: VITE_GOOGLE_MAPS_API_KEY
                sync: false
              - key: VITE_API_URL
                sync: false  # Set to staging backend URL
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            autoDeployTrigger: commit

          # Fastify Backend - Staging
          - type: web
            name: stage-ride-request-fastify
            runtime: node
            repo: https://github.com/swarmnyc/ruraldispatch-ride-request
            branch: feat/move_relational_db
            rootDir: server-fastify
            plan: free
            region: ohio
            buildCommand: npm install && npx prisma generate && npm run build
            startCommand: npm run start:prod
            envVars:
              - key: NODE_ENV
                value: production
              - key: PORT
                value: 5000
              - key: DATABASE_URL
                sync: false
              - key: CLIENT_URL
                sync: false  # Set to staging frontend URL
              - key: JWT_SECRET
                generateValue: true
              - key: TWILIO_ACCOUNT_SID
                sync: false
              - key: TWILIO_AUTH_TOKEN
                sync: false
              - key: TWILIO_PHONE_NUMBER
                sync: false
              - key: TWILIO_MESSAGING_SERVICE_SID
                sync: false
              - key: TWILIO_WEBHOOK_URL
                sync: false
              - key: TWILIO_STATUS_CALLBACK_URL
                sync: false
              - key: VONAGE_API_KEY
                sync: false
              - key: VONAGE_API_SECRET
                sync: false
              - key: VONAGE_FROM_NUMBER
                sync: false
              - key: VONAGE_WEBHOOK_URL
                sync: false
              - key: GOOGLE_MAPS_API_KEY
                sync: false
            autoDeployTrigger: commit

        # Staging Database
        databases:
          - name: stage-rural-dispatch-postgres
            databaseName: stage_rural_dispatch
            user: stage_user
            plan: free
            region: ohio

      # ==========================================
      # PRODUCTION ENVIRONMENT
      # ==========================================
      - name: Production
        services:
          # React Frontend - Production
          - type: web
            name: prod-ride-request-client
            runtime: static
            repo: https://github.com/swarmnyc/ruraldispatch-ride-request
            branch: main
            rootDir: client
            plan: free  # Upgrade for production
            region: ohio
            buildCommand: npm install && npm run build
            staticPublishPath: ./dist
            envVars:
              - key: VITE_GOOGLE_MAPS_API_KEY
                sync: false
              - key: VITE_API_URL
                sync: false  # Set to production backend URL
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            autoDeployTrigger: commit

          # Fastify Backend - Production
          - type: web
            name: prod-ride-request-fastify
            runtime: node
            repo: https://github.com/swarmnyc/ruraldispatch-ride-request
            branch: main
            rootDir: server-fastify
            plan: free  # Upgrade for production
            region: ohio
            buildCommand: npm install && npx prisma generate && npm run build
            startCommand: npm run start:prod
            envVars:
              - key: NODE_ENV
                value: production
              - key: PORT
                value: 5000
              - key: DATABASE_URL
                sync: false
              - key: CLIENT_URL
                sync: false  # Set to production frontend URL
              - key: JWT_SECRET
                generateValue: true
              - key: TWILIO_ACCOUNT_SID
                sync: false
              - key: TWILIO_AUTH_TOKEN
                sync: false
              - key: TWILIO_PHONE_NUMBER
                sync: false
              - key: TWILIO_MESSAGING_SERVICE_SID
                sync: false
              - key: TWILIO_WEBHOOK_URL
                sync: false
              - key: TWILIO_STATUS_CALLBACK_URL
                sync: false
              - key: VONAGE_API_KEY
                sync: false
              - key: VONAGE_API_SECRET
                sync: false
              - key: VONAGE_FROM_NUMBER
                sync: false
              - key: VONAGE_WEBHOOK_URL
                sync: false
              - key: GOOGLE_MAPS_API_KEY
                sync: false
            autoDeployTrigger: commit

        # Production Database
        databases:
          - name: prod-rural-dispatch-postgres
            databaseName: prod_rural_dispatch
            user: prod_user
            plan: free  # Upgrade to paid plan for production
            region: ohio

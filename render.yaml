# Render Blueprint - Rural Dispatch
# Monorepo deployment with staging environment
# Production environment commented out until ready to merge to main
version: "1"

projects:
  - name: rural_dispatch

    # ==========================================
    # STAGING ENVIRONMENT
    # ==========================================
    environments:
      - name: Staging
        services:
          # React Frontend - Staging
          - type: web
            name: stage-ride-request-client
            runtime: static
            repo: https://github.com/swarmnyc/ruraldispatch-ride-request
            branch: feat/move_relational_db
            rootDir: client
            buildCommand: bun install && bun run build
            staticPublishPath: ./dist
            envVars:
              - key: VITE_GOOGLE_MAPS_API_KEY
                sync: false
              - key: VITE_API_URL
                sync: false  # Set to staging backend URL
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            autoDeployTrigger: commit

          # Fastify Backend - Staging
          - type: web
            name: stage-ride-request-fastify
            runtime: node
            repo: https://github.com/swarmnyc/ruraldispatch-ride-request
            branch: feat/move_relational_db
            rootDir: server-fastify
            plan: free
            region: ohio
            buildCommand: bun install && bunx prisma generate --schema=./prisma/schema.prisma && bun run build
            startCommand: bun run start:prod
            envVars:
              - key: NODE_ENV
                value: production
              - key: PORT
                value: 5000
              - key: DATABASE_URL
                sync: false
              - key: CLIENT_URL
                sync: false  # Set to staging frontend URL
              - key: JWT_SECRET
                generateValue: true
              - key: TWILIO_ACCOUNT_SID
                sync: false
              - key: TWILIO_AUTH_TOKEN
                sync: false
              - key: TWILIO_PHONE_NUMBER
                sync: false
              - key: TWILIO_MESSAGING_SERVICE_SID
                sync: false
              - key: TWILIO_WEBHOOK_URL
                sync: false
              - key: TWILIO_STATUS_CALLBACK_URL
                sync: false
              - key: VONAGE_API_KEY
                sync: false
              - key: VONAGE_API_SECRET
                sync: false
              - key: VONAGE_FROM_NUMBER
                sync: false
              - key: VONAGE_WEBHOOK_URL
                sync: false
              - key: GOOGLE_MAPS_API_KEY
                sync: false
            autoDeployTrigger: commit

        # Staging Database
        databases:
          - name: stage-rural-dispatch-postgres
            databaseName: stage_rural_dispatch
            user: stage_user
            plan: free
            region: ohio

